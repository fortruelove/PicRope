name: Publish requested PicRope 1.2.5

on:
  push:
    branches: [main]
    paths: [.github/workflows/release-1.2.5.yml]

permissions:
  contents: read

concurrency:
  group: publish-picrope-1-2-5
  cancel-in-progress: false

jobs:
  release-1-2-5:
    if: >-
      github.repository == 'fortruelove/PicRope' && startsWith(github.event.head_commit.message, 'release: PicRope 1.2.5')
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Check out the requested release commit
        shell: pwsh
        run: |
          git init .
          git remote add origin https://github.com/fortruelove/PicRope.git
          git fetch --depth=1 origin $env:RELEASE_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Source checkout failed' }
          git checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source checkout failed' }
      - name: Build and verify version 1.2.5
        shell: pwsh
        run: |
          ./build.ps1
          ./tests/RunCardTests.ps1
          ./package.ps1
          $version = [Diagnostics.FileVersionInfo]::GetVersionInfo((Join-Path $PWD 'build/PicRope.exe')).ProductVersion
          if ($version -ne '1.2.5') { throw 'This workflow only publishes version 1.2.5' }
      - name: Publish the requested new release
        shell: pwsh
        run: |
          $existing = gh release list --repo fortruelove/PicRope --limit 100 --json tagName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect existing releases' }
          if ($existing | Where-Object tagName -eq 'v1.2.5') { throw 'Release already exists; refusing to overwrite it' }
          gh release create v1.2.5 releases/PicRope-1.2.5-windows-x64.zip releases/PicRope-1.2.5-windows-x64.zip.sha256 --repo fortruelove/PicRope --target $env:RELEASE_SHA --title 'PicRope 1.2.5' --notes-file docs/releases/1.2.5.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
