name: Publish requested PicRope 1.2.5

on:
  push:
    branches: [main]
    paths: [.github/workflows/release-1.2.5.yml]

permissions:
  contents: read

concurrency:
  group: publish-picrope-1-2-5
  cancel-in-progress: false

jobs:
  release-1-2-5:
    if: >-
      github.repository == 'fortruelove/PicRope' && startsWith(github.event.head_commit.message, 'release: PicRope 1.2.5')
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Check out the requested release commit
        shell: pwsh
        run: |
          git init .
          git remote add origin https://github.com/fortruelove/PicRope.git
          git fetch --depth=1 origin $env:RELEASE_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Source checkout failed' }
          git checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source checkout failed' }
      - name: Build and verify version 1.2.5
        shell: pwsh
        run: |
          ./build.ps1
          ./tests/RunCardTests.ps1
          ./package.ps1
          ./build.ps1 -UpdateTests
          Expand-Archive -LiteralPath releases/PicRope-1.2.5-windows-x64.zip -DestinationPath 'build/install-test [1.2.5]'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/InstallTests.ps1 -InstallerPath 'build/install-test [1.2.5]/install.ps1'
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell installer tests failed' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File 'build/install-test [1.2.5]/install.ps1'
          if ($LASTEXITCODE -ne 0) { throw 'Real installation failed' }
          $installed = Join-Path $env:LOCALAPPDATA 'Programs/PicRope'
          $ready = $false
          for ($i = 0; $i -lt 30; $i++) {
            $log = Join-Path $installed 'logs/latest.log'
            if ((Test-Path -LiteralPath $log) -and (Get-Content -LiteralPath $log -Raw).Contains('Application ready')) { $ready = $true; break }
            Start-Sleep -Milliseconds 500
          }
          if (-not $ready) { throw 'Installed application did not finish startup or create logs/latest.log' }
          Start-Process -FilePath (Join-Path $installed 'PicRope.exe') -ArgumentList '--quit' -WindowStyle Hidden -Wait
          $version = [Diagnostics.FileVersionInfo]::GetVersionInfo((Join-Path $PWD 'build/PicRope.exe')).ProductVersion
          if ($version -ne '1.2.5') { throw 'This workflow only publishes version 1.2.5' }
      - name: Replace the explicitly requested version 1.2.5 release
        shell: pwsh
        run: |
          $release = gh release view v1.2.5 --repo fortruelove/PicRope --json tagName,targetCommitish | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.tagName -ne 'v1.2.5') { throw 'Cannot inspect requested release' }
          $tag = gh api repos/fortruelove/PicRope/git/ref/tags/v1.2.5 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect release tag' }
          if ($tag.object.sha -ne '9dddcfa8bd2e3226e7385cf1f344252e4f451567' -and $tag.object.sha -ne $env:RELEASE_SHA) { throw 'Release tag changed unexpectedly' }
          gh release upload v1.2.5 releases/PicRope-1.2.5-windows-x64.zip releases/PicRope-1.2.5-windows-x64.zip.sha256 --repo fortruelove/PicRope --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release asset replacement failed' }
          gh api --method PATCH repos/fortruelove/PicRope/git/refs/tags/v1.2.5 -f sha=$env:RELEASE_SHA -F force=true
          if ($LASTEXITCODE -ne 0) { throw 'Release tag update failed' }
          gh release edit v1.2.5 --repo fortruelove/PicRope --target $env:RELEASE_SHA --title 'PicRope 1.2.5' --notes-file docs/releases/1.2.5.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release metadata update failed' }
