name: Publish requested PicRope 1.2.6
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-1.2.6.yml]
permissions:
  contents: read
concurrency:
  group: publish-picrope-1-2-6
  cancel-in-progress: false
jobs:
  release-1-2-6:
    if: >-
      github.repository == 'fortruelove/PicRope' && startsWith(github.event.head_commit.message, 'release: PicRope 1.2.6')
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Check out the requested release commit
        shell: pwsh
        run: |
          git init .
          git remote add origin https://github.com/fortruelove/PicRope.git
          git fetch --depth=1 origin $env:RELEASE_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Source checkout failed' }
          git checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source checkout failed' }
      - name: Build and verify version 1.2.6
        shell: pwsh
        run: |
          ./build.ps1
          ./tests/RunCardTests.ps1
          ./package.ps1
          ./build.ps1 -UpdateTests
          Expand-Archive -LiteralPath releases/PicRope-1.2.6-windows-x64.zip -DestinationPath 'build/install-test [1.2.6]'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/InstallTests.ps1 -InstallerPath 'build/install-test [1.2.6]/install.ps1'
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell installer tests failed' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File 'build/install-test [1.2.6]/install.ps1'
          if ($LASTEXITCODE -ne 0) { throw 'Real installation failed' }
          $installed = Join-Path $env:LOCALAPPDATA 'Programs/PicRope'
          $ready = $false
          for ($i = 0; $i -lt 30; $i++) {
            $log = Join-Path $installed 'logs/latest.log'
            if ((Test-Path -LiteralPath $log) -and (Get-Content -LiteralPath $log -Raw).Contains('Application ready')) { $ready = $true; break }
            Start-Sleep -Milliseconds 500
          }
          if (-not $ready) { throw 'Installed application did not finish startup' }
          Start-Process -FilePath (Join-Path $installed 'PicRope.exe') -ArgumentList '--quit' -WindowStyle Hidden -Wait
          $version = [Diagnostics.FileVersionInfo]::GetVersionInfo((Join-Path $PWD 'build/PicRope.exe')).ProductVersion
          if ($version -ne '1.2.6') { throw 'This workflow only publishes version 1.2.6' }
      - name: Publish only the requested new v1.2.6
        shell: pwsh
        run: |
          gh release view v1.2.6 --repo fortruelove/PicRope *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Release v1.2.6 already exists; refusing to overwrite it' }
          gh release create v1.2.6 releases/PicRope-1.2.6-windows-x64.zip releases/PicRope-1.2.6-windows-x64.zip.sha256 --repo fortruelove/PicRope --target $env:RELEASE_SHA --title 'PicRope 1.2.6' --notes-file docs/releases/1.2.6.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
